<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Brand highlight</title>
  <desc id="desc">A promotional brand illustration for the repository website.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect x="100" y="70" width="600" height="460" rx="28" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(148,163,184,0.35)"/>
  <circle cx="245" cy="220" r="110" fill="url(#grad)" opacity="0.9"/>
  <circle cx="530" cy="220" r="90" fill="rgba(125,211,252,0.18)" stroke="rgba(125,211,252,0.4)"/>
  <rect x="200" y="175" width="300" height="22" rx="11" fill="#e2e8f0" opacity="0.8"/>
  <rect x="200" y="215" width="250" height="22" rx="11" fill="#cbd5e1" opacity="0.75"/>
  <rect x="200" y="260" width="330" height="22" rx="11" fill="#94a3b8" opacity="0.8"/>
  <rect x="200" y="332" width="180" height="54" rx="18" fill="#0f172a" stroke="rgba(125,211,252,0.3)"/>
  <rect x="400" y="332" width="180" height="54" rx="18" fill="#0f172a" stroke="rgba(125,211,252,0.3)"/>
  <text x="240" y="368" font-family="Arial, sans-serif" font-size="22" fill="#7dd3fc" font-weight="700">HTML</text>
  <text x="440" y="368" font-family="Arial, sans-serif" font-size="22" fill="#93c5fd" font-weight="700">CSS</text>
  <text x="270" y="460" font-family="Arial, sans-serif" font-size="34" fill="#f8fafc" font-weight="700">Website ready</text>
</svg>
